[project]
name = "mcts-forest"
version = "0.1.0"
description = "Monte Carlo Forest Benchmarking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[toy-text]>=1.2.3",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "rich>=15.0.0",
    "setuptools<70.0.0",
    "torch>=2.12.1",
]

[tool.uv]
package = true

[project.scripts]
benchmark = "mcts_forest.scripts.benchmark:main"
